name: dist

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create zips
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          zip -r "commandk-${VERSION}.zip" dist
          (cd dist && zip -r "../commandk-chrome-${VERSION}.zip" chrome)
          (cd dist && zip -r "../commandk-firefox-${VERSION}.zip" firefox)
          ls -lh *.zip
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Upload artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.VERSION }}
          path: |
            commandk-*.zip
            checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            commandk-*.zip
            checksums.txt
          generate_release_notes: true

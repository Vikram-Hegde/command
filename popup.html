<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="palette.css">
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('fonts/inter-400.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:500 600;font-display:swap;src:url('fonts/inter-600.woff2') format('woff2')}
*{box-sizing:border-box}
body{width:340px;margin:0;padding:14px 14px 12px;font:13px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#1a1a1a;color:#f5f5f5}
.header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:grid;place-items:center;color:#e0e0e0}
.logo svg{width:18px;height:18px;display:block}
h1{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0}
.sub{font-size:12px;color:#a3a3a3;margin:1px 0 0}
.shortcut{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:8px 11px;margin-bottom:10px;font-size:12.5px;color:#c9c9d4}
kbd{font-family:inherit;font-size:11px;font-weight:600;color:#f5f5f5;border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 6px;background:rgba(255,255,255,.05);white-space:nowrap}
.mini{margin:0 0 10px;border:1px solid rgba(255,255,255,.09);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03)}
.mini .cmdk-input-row{padding:10px 12px}
.mini .cmdk-input{font-size:13.5px}
.mini .cmdk-list{max-height:290px}
.mini .cmdk-item{font-size:13px;padding:7px 9px}
button{width:100%;padding:10px;border:0;border-radius:10px;background:#f5f5f5;color:#141419;font:600 13px "Inter",system-ui,sans-serif;cursor:pointer}
button:hover{background:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:disabled:hover{background:#f5f5f5}
.notice{display:block;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;color:#e0c88f;margin:0 0 10px}
.notice[hidden]{display:none}
.hints{display:flex;gap:10px;margin:10px 2px 8px;font-size:11.5px;color:rgba(245,245,245,.5)}
.note{font-size:11.5px;color:#8a8a96;margin:0}
</style></head>
<body>
<div class="header">
  <span class="logo" id="logo"></span>
  <div><h1>CommandK</h1><p class="sub">Arc-style command palette</p></div>
</div>
<div class="shortcut"><span>Press</span><kbd>Ctrl/⌘</kbd><kbd>Shift</kbd><kbd>K</kbd><span>to open</span></div>
<p class="notice" id="notice" hidden></p>
<div class="mini">
  <div class="cmdk-input-row">
    <span class="cmdk-icon" id="mini-logo"></span>
    <input class="cmdk-input" id="q" placeholder="Search tabs, actions, bookmarks…" autocomplete="off" spellcheck="false" />
    <span class="cmdk-chip" id="chip"></span>
  </div>
  <div class="cmdk-list" id="results"></div>
</div>
<button id="open">Open full palette on this tab</button>
<div class="hints" id="hints"></div>
<p class="note">The full overlay can't run on browser, error or store pages — but this mini palette works everywhere.</p>
<script src="phosphor-icons.js"></script>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
